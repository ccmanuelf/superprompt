services:
  # ── clauded bot ──────────────────────────────────────────────
  clauded:
    build:
      context: .
      dockerfile: docker/clauded.dockerfile
    container_name: clauded-bot
    env_file:
      - .env
      - docker/.env.docker
    environment:
      # Claude CLI auth — uses subscription (Max) via long-lived OAuth token
      # Generated with: claude setup-token
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # GitHub CLI auth (optional — for github_* tools)
      - GH_TOKEN=${GH_TOKEN:-}
      # Render API key (optional — for render_* tools)
      - RENDER_API_KEY=${RENDER_API_KEY:-}
    volumes:
      # Config files (readEnvFile reads from disk, not process.env)
      - ./.env:/app/.env:ro
      - ./docker/.env.docker:/app/.env.docker:ro
      # Persistent data
      - ./store:/app/store
      # Temp media uploads
      - ./workspace:/app/workspace
      # Domain packs (customizable per department)
      - ./packs:/app/packs
      # Forge tools & skills (user-created)
      - ./forge:/app/forge
      # Documentation (served via /docs web UI)
      - ./docs:/app/docs:ro
    # Web UI: Voice Chat, Board, Learning Coach
    ports:
      - "127.0.0.1:3030:3030"
    # Uncomment to mount TLS certs for voice web HTTPS:
    #   - ./certs:/app/certs:ro
    depends_on:
      speaches:
        condition: service_started
      searxng:
        condition: service_healthy
    networks:
      - clauded-net
    restart: unless-stopped
    # SECURITY: no access to sensitive host directories
    # Mounted: .env (ro), store (rw), workspace (rw), packs (rw), forge (rw), docs (ro)

  # ── Speaches voice sidecar ─────────────────────────────────
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: clauded-speaches
    volumes:
      - speaches-models:/root/.cache
    environment:
      # Models are loaded via API and cached in speaches-models volume
      - UVICORN_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - clauded-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ── SearXNG search engine ───────────────────────────────────
  # Self-hosted meta-search: queries DuckDuckGo, Bing, Brave, Wikipedia,
  # arXiv, Semantic Scholar — no API keys needed. Used by Ollama's
  # web_search tool. Internal network only (not exposed to host).
  searxng:
    image: searxng/searxng:latest
    container_name: clauded-searxng
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    # No ports exposed — only accessible from clauded via Docker network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - clauded-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Caddy reverse proxy (production HTTPS) ─────────────────
  # Provides automatic HTTPS via Let's Encrypt, HTTP/2, WebSocket proxy,
  # request size limits (10MB), security headers, and access logging.
  # Only service that exposes ports to the network (80 + 443).
  caddy:
    image: caddy:2-alpine
    container_name: clauded-caddy
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # TLS certificates (auto-managed)
      - caddy-config:/config   # Caddy runtime config
    ports:
      - "80:80"     # HTTP → HTTPS redirect
      - "443:443"   # HTTPS (production)
    depends_on:
      - clauded
    networks:
      - clauded-net
    restart: unless-stopped
    profiles:
      # Only starts when explicitly requested: docker compose --profile production up
      # For local dev, access clauded directly on port 3030
      - production

  # ── Synapse Matrix homeserver (optional) ───────────────────
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: clauded-synapse
    volumes:
      - synapse-data:/data
      - ./docker/synapse/homeserver.yaml:/data/homeserver.yaml:ro
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    ports:
      # Localhost only — not exposed to network
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - clauded-net
    restart: unless-stopped
    profiles:
      # Only starts when explicitly requested: docker compose --profile matrix up
      - matrix

networks:
  clauded-net:
    driver: bridge

volumes:
  speaches-models:
  synapse-data:
  caddy-data:       # TLS certificates (Let's Encrypt, auto-renewed)
  caddy-config:     # Caddy runtime configuration
