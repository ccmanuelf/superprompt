<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>clauded — Voice Chat</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #14141f;
      --border: #2a2a3a;
      --text: #e0e0e8;
      --text-dim: #888898;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.3);
      --danger: #ff4d6a;
      --success: #4dff8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Auth Screen ─────────────────────────── */
    #auth-screen {
      text-align: center;
      padding: 2rem;
    }
    #auth-screen h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    #auth-screen input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      width: 280px;
      outline: none;
    }
    #auth-screen input:focus { border-color: var(--accent); }
    #auth-screen button {
      display: block;
      margin: 1rem auto 0;
      padding: 0.75rem 2rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    #auth-screen button:hover { opacity: 0.9; }

    /* ── Main Screen ─────────────────────────── */
    #main-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      height: 100vh;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .status-dot.connected { background: var(--success); }

    /* ── Waveform ────────────────────────────── */
    #waveform-container {
      width: 100%;
      height: 120px;
      margin: 1rem 0;
      position: relative;
    }
    #waveform {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: var(--surface);
    }

    /* ── State Indicator ─────────────────────── */
    #state-indicator {
      font-size: 0.9rem;
      color: var(--text-dim);
      height: 1.5rem;
      margin-bottom: 1rem;
    }

    /* ── Main Action Button ──────────────────── */
    #action-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #action-btn:hover { border-color: var(--accent); }
    #action-btn.listening {
      border-color: var(--success);
      box-shadow: 0 0 20px rgba(77, 255, 143, 0.15);
    }
    #action-btn.recording {
      border-color: var(--danger);
      box-shadow: 0 0 30px rgba(255, 77, 106, 0.3);
      background: rgba(255, 77, 106, 0.1);
    }
    #action-btn.processing {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      animation: pulse 1.5s ease-in-out infinite;
    }
    #action-btn.playing {
      border-color: var(--success);
      box-shadow: 0 0 30px rgba(77, 255, 143, 0.2);
    }
    #action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ── Controls ────────────────────────────── */
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 1.5rem;
    }
    .mode-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .mode-toggle button {
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .mode-toggle button.active {
      background: var(--accent);
      color: white;
    }

    /* ── VAD Sensitivity ─────────────────────── */
    .vad-controls {
      display: none;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .vad-controls.visible { display: flex; }
    .vad-controls input[type="range"] {
      width: 120px;
      accent-color: var(--accent);
    }

    /* ── Transcript ──────────────────────────── */
    #transcript-area {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      margin-top: 1.5rem;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      max-width: 90%;
    }
    .message.user {
      background: var(--accent);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      background: var(--surface);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message .provider-tag {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
    }

    /* ── Mobile ──────────────────────────────── */
    @media (max-width: 480px) {
      #action-btn { width: 120px; height: 120px; }
      #main-screen { padding: 1rem; }
    }
  </style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <h1>clauded voice</h1>
  <p style="color: var(--text-dim); font-size: 0.85rem; max-width: 340px; margin: 0 auto 1rem; line-height: 1.5;">
    Enter your personal access token to connect.<br>
    Generate one in Telegram: <code style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; font-size: 0.8rem;">/webtoken create</code>
  </p>
  <p style="color: var(--text-dim); font-size: 0.8rem; max-width: 340px; margin: 0 auto 1.5rem; line-height: 1.4;">
    Ingresa tu token personal de acceso.<br>
    Genera uno en Telegram: <code style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; font-size: 0.8rem;">/webtoken create</code>
  </p>
  <input type="password" id="token-input" placeholder="Enter access token / Ingresa token" autofocus>
  <button id="connect-btn" onclick="connect()">Connect / Conectar</button>
</div>

<!-- Main Screen -->
<div id="main-screen">
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Disconnected</span>
  </div>

  <div id="waveform-container">
    <canvas id="waveform"></canvas>
  </div>

  <div id="state-indicator">Ready</div>

  <button id="action-btn" disabled>Start Conversation</button>

  <div class="controls">
    <div class="mode-toggle">
      <button id="conv-mode-btn" class="active" onclick="setMode('vad')">Conversation</button>
      <button id="ptt-mode-btn" onclick="setMode('ptt')">Push to Talk</button>
    </div>
  </div>

  <div class="vad-controls" id="vad-controls">
    <span>Sensitivity</span>
    <input type="range" id="vad-threshold" min="1" max="100" value="30">
    <span id="vad-value">30</span>
  </div>

  <div id="diag-row" style="display:flex;gap:0.5rem;margin-top:0.5rem;align-items:center;font-size:0.7rem;color:var(--text-dim);">
    <span id="build-tag">build: rc.81</span>
    <button id="test-audio-btn" type="button" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:2px 8px;border-radius:4px;font-size:0.7rem;cursor:pointer;">🔊 Test audio</button>
    <span id="audio-diag"></span>
  </div>

  <div id="transcript-area"></div>
</div>

<script>
// ── State ─────────────────────────────────────────
let ws = null;
let mediaRecorder = null;
let audioContext = null;
let analyser = null;
let sourceNode = null;
let mediaStream = null;
let mode = 'vad'; // default: conversation (VAD) mode
let conversationActive = false; // is the conversation loop running?
let isRecording = false;
let isProcessing = false;
let isPlaying = false;
let vadActive = false;
let vadThreshold = 30;
let vadSilenceTimeout = null;
let reconnectDelay = 1000;
let reconnectTimer = null;
let animFrameId = null;
let chunks = [];
let recordingStartedAt = 0;
const VAD_SILENCE_MS = 1200; // silence before auto-stop
const MIN_RECORDING_MS = 350; // shorter blobs are almost always unintentional taps
const MIN_BLOB_BYTES = 2000; // below this the webm has no decodable cluster

// ── Elements ──────────────────────────────────────
const authScreen = document.getElementById('auth-screen');
const mainScreen = document.getElementById('main-screen');
const tokenInput = document.getElementById('token-input');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const stateIndicator = document.getElementById('state-indicator');
const actionBtn = document.getElementById('action-btn');
const convModeBtn = document.getElementById('conv-mode-btn');
const pttModeBtn = document.getElementById('ptt-mode-btn');
const vadControls = document.getElementById('vad-controls');
const vadSlider = document.getElementById('vad-threshold');
const vadValue = document.getElementById('vad-value');
const transcriptArea = document.getElementById('transcript-area');
const waveformCanvas = document.getElementById('waveform');
const waveformCtx = waveformCanvas.getContext('2d');

// Enter key to connect
tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

// VAD slider
vadSlider.addEventListener('input', () => {
  vadThreshold = parseInt(vadSlider.value);
  vadValue.textContent = vadThreshold;
});

// ── Connection ────────────────────────────────────
function connect() {
  const token = tokenInput.value.trim();
  if (!token) return;

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${protocol}//${location.host}`;

  if (ws) ws.close();

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    reconnectDelay = 1000;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    // First-message auth: send token + mode (never in URL)
    ws.send(JSON.stringify({ type: 'auth', token, mode: 'voice' }));
  };

  ws.onmessage = async (event) => {
    if (event.data instanceof ArrayBuffer) {
      // Binary = audio response
      console.info('voice: binary frame received', { bytes: event.data.byteLength });
      setAudioDiag(`rx ${event.data.byteLength}B`);
      await playAudio(event.data);
      return;
    }

    const msg = JSON.parse(event.data);

    switch (msg.type) {
      case 'ready':
        authScreen.style.display = 'none';
        mainScreen.style.display = 'flex';
        setConnected(true);
        await initAudio();
        // Auto-start conversation mode
        if (mode === 'vad') {
          startConversation();
        }
        break;

      case 'response':
        addMessage(msg.transcript, 'user');
        addMessage(msg.text, 'assistant', msg.provider);
        break;

      case 'status':
        if (msg.status === 'processing') {
          isProcessing = true;
          updateButton();
          stateIndicator.textContent = 'Thinking...';
        } else if (msg.status === 'idle') {
          isProcessing = false;
          updateButton();
          if (conversationActive && !isPlaying) {
            stateIndicator.textContent = 'Listening...';
          } else if (!isPlaying) {
            stateIndicator.textContent = 'Ready';
          }
        }
        break;

      case 'error':
        stateIndicator.textContent = `Error: ${msg.message}`;
        isProcessing = false;
        updateButton();
        break;

      case 'pong':
        break;
    }
  };

  ws.onclose = (event) => {
    setConnected(false);
    conversationActive = false;
    if (event.code !== 4001) {
      // Auto-reconnect with exponential backoff
      reconnectTimer = setTimeout(() => {
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        connect();
      }, reconnectDelay);
      stateIndicator.textContent = `Reconnecting in ${Math.round(reconnectDelay / 1000)}s...`;
    } else {
      // Unauthorized — go back to auth screen
      authScreen.style.display = '';
      mainScreen.style.display = 'none';
      stateIndicator.textContent = 'Invalid token';
    }
  };

  ws.onerror = () => {
    // onclose will handle reconnection
  };
}

function setConnected(connected) {
  statusDot.classList.toggle('connected', connected);
  statusText.textContent = connected ? 'Connected' : 'Disconnected';
  actionBtn.disabled = !connected;
  if (!connected) {
    cleanupAudio();
    conversationActive = false;
    updateButton();
  }
}

function cleanupAudio() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (audioContext) {
    audioContext.close().catch(() => {});
    audioContext = null;
  }
  analyser = null;
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
}

// ── Audio Init ────────────────────────────────────
async function initAudio() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new AudioContext();
    sourceNode = audioContext.createMediaStreamSource(mediaStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    sourceNode.connect(analyser);
    drawWaveform();
  } catch (err) {
    stateIndicator.textContent = 'Microphone access denied';
    console.error('Mic access failed:', err);
  }
}

// ── Recording ─────────────────────────────────────
function startRecording() {
  if (!mediaStream || isRecording || isProcessing || isPlaying) return;

  chunks = [];
  mediaRecorder = new MediaRecorder(mediaStream, {
    mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : 'audio/webm',
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) chunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    if (chunks.length === 0) return;
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const duration = Date.now() - recordingStartedAt;
    if (blob.size < MIN_BLOB_BYTES || duration < MIN_RECORDING_MS) {
      // Avoid round-tripping webms the server would reject as undecodable.
      console.debug('voice: dropping short recording', { bytes: blob.size, ms: duration });
      stateIndicator.textContent = conversationActive ? 'Listening...' : 'Ready';
      return;
    }
    if (ws && ws.readyState === WebSocket.OPEN) {
      blob.arrayBuffer().then((buf) => ws.send(buf));
    }
  };

  mediaRecorder.start();
  recordingStartedAt = Date.now();
  isRecording = true;
  updateButton();
  stateIndicator.textContent = 'Listening...';
}

function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  mediaRecorder.stop();
  isRecording = false;
  updateButton();
  stateIndicator.textContent = 'Processing...';
}

// ── Conversation Mode (VAD-based free-flow) ───────
function startConversation() {
  conversationActive = true;
  startVAD();
  updateButton();
  stateIndicator.textContent = 'Listening...';
}

function endConversation() {
  conversationActive = false;
  stopVAD();
  if (isRecording) stopRecording();
  updateButton();
  stateIndicator.textContent = 'Ready';
}

// ── Action Button (tap to start/end conversation, or PTT) ──
actionBtn.addEventListener('pointerdown', (e) => {
  if (mode === 'ptt') {
    e.preventDefault();
    startRecording();
  }
});
actionBtn.addEventListener('pointerup', () => {
  if (mode === 'ptt') {
    stopRecording();
  }
});
actionBtn.addEventListener('pointerleave', () => {
  if (mode === 'ptt') {
    stopRecording();
  }
});
actionBtn.addEventListener('click', () => {
  if (mode !== 'vad') return;
  if (conversationActive) {
    endConversation();
  } else {
    startConversation();
  }
});
// Prevent context menu on long press (mobile)
actionBtn.addEventListener('contextmenu', (e) => e.preventDefault());

// ── Mode Toggle ───────────────────────────────────
function setMode(newMode) {
  mode = newMode;
  convModeBtn.classList.toggle('active', mode === 'vad');
  pttModeBtn.classList.toggle('active', mode === 'ptt');
  vadControls.classList.toggle('visible', mode === 'vad');

  if (mode === 'ptt') {
    endConversation();
  } else {
    // Switching to conversation mode — auto-start
    startConversation();
  }
}

// ── VAD (Voice Activity Detection) ────────────────
function startVAD() {
  if (!analyser) return;
  vadActive = true;
  monitorVAD();
}

function stopVAD() {
  vadActive = false;
  if (vadSilenceTimeout) { clearTimeout(vadSilenceTimeout); vadSilenceTimeout = null; }
}

function monitorVAD() {
  if (!vadActive || !analyser) return;

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);

  // RMS energy
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / data.length);

  // Threshold scaled: slider 1-100 maps to RMS 12-80. The previous 2-80
  // range let HVAC / keyboard noise trip the detector constantly at low
  // sensitivity, producing a stream of empty "no speech" bubbles.
  const threshold = 12 + (vadThreshold / 100) * 68;

  if (rms > threshold) {
    // Speech detected
    if (!isRecording && !isProcessing && !isPlaying) {
      startRecording();
    }
    // Reset silence timer
    if (vadSilenceTimeout) { clearTimeout(vadSilenceTimeout); vadSilenceTimeout = null; }
  } else if (isRecording) {
    // Silence — start countdown to stop
    if (!vadSilenceTimeout) {
      vadSilenceTimeout = setTimeout(() => {
        stopRecording();
        vadSilenceTimeout = null;
      }, VAD_SILENCE_MS);
    }
  }

  requestAnimationFrame(monitorVAD);
}

// ── Diagnostics helpers ───────────────────────────
function setAudioDiag(text) {
  const el = document.getElementById('audio-diag');
  if (el) el.textContent = text;
}

// Test button — proves browser can decode + play mp3 from our server
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('test-audio-btn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    setAudioDiag('testing...');
    try {
      // 1kHz tone encoded as a minimal mp3 (silent would mask speaker issues,
      // so we generate a Web Audio beep — no network dependency).
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') await ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
      setAudioDiag('beep ok ✓');
    } catch (err) {
      console.error('test audio failed', err);
      setAudioDiag(`beep FAIL: ${err.name || err.message}`);
    }
  });
});

// ── Audio Playback ────────────────────────────────
async function playAudio(arrayBuffer) {
  if (!arrayBuffer || arrayBuffer.byteLength === 0) {
    console.warn('voice: received empty audio frame, skipping playback');
    setAudioDiag('empty frame');
    return;
  }

  isPlaying = true;
  updateButton();
  stateIndicator.textContent = 'Speaking...';

  let url = null;
  try {
    const blob = new Blob([arrayBuffer], { type: 'audio/mpeg' });
    url = URL.createObjectURL(blob);
    const audio = new Audio(url);

    console.info('voice: playback starting');
    setAudioDiag('playing...');
    await new Promise((resolve, reject) => {
      audio.onended = () => { console.info('voice: playback ended'); resolve(); };
      audio.onerror = () => reject(new Error('audio element error'));
      audio.play().catch(reject);
    });
    setAudioDiag('played ✓');
  } catch (err) {
    console.error('voice: playback failed', err);
    // Surface autoplay / decode failures so the user isn't silently left with
    // text-only replies. Autoplay blocks look like NotAllowedError from play().
    const isAutoplayBlocked = err && (err.name === 'NotAllowedError' || /user (gesture|activation)/i.test(err.message || ''));
    setAudioDiag(isAutoplayBlocked ? `BLOCKED: ${err.name}` : `FAIL: ${err.name || err.message}`);
    stateIndicator.textContent = isAutoplayBlocked
      ? 'Playback blocked — click ▶ Test audio once to unlock'
      : 'Playback error (text still shown)';
  } finally {
    if (url) URL.revokeObjectURL(url);
  }

  isPlaying = false;
  updateButton();

  // After bot finishes speaking, resume listening automatically
  if (conversationActive && vadActive) {
    stateIndicator.textContent = 'Listening...';
    monitorVAD();
  } else {
    stateIndicator.textContent = 'Ready';
  }
}

// ── Waveform Visualization ────────────────────────
function drawWaveform() {
  // Set canvas size to match display size
  const rect = waveformCanvas.getBoundingClientRect();
  waveformCanvas.width = rect.width * (window.devicePixelRatio || 1);
  waveformCanvas.height = rect.height * (window.devicePixelRatio || 1);
  waveformCtx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

  function draw() {
    animFrameId = requestAnimationFrame(draw);

    const w = rect.width;
    const h = rect.height;

    waveformCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface');
    waveformCtx.fillRect(0, 0, w, h);

    if (!analyser) return;

    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);

    const barWidth = w / data.length;
    const centerY = h / 2;

    // Choose color based on state
    let color = '#2a2a3a';
    if (isRecording) color = '#ff4d6a';
    else if (isProcessing) color = '#6c63ff';
    else if (isPlaying) color = '#4dff8f';
    else if (conversationActive) color = '#3a5a3a'; // subtle green when listening idle

    waveformCtx.fillStyle = color;

    for (let i = 0; i < data.length; i++) {
      const barHeight = (data[i] / 255) * (h * 0.8);
      const x = i * barWidth;
      waveformCtx.fillRect(x, centerY - barHeight / 2, Math.max(barWidth - 1, 1), barHeight || 1);
    }
  }

  draw();
}

// Handle canvas resize
window.addEventListener('resize', () => {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  drawWaveform();
});

// ── UI Helpers ────────────────────────────────────
function updateButton() {
  if (isRecording) {
    actionBtn.className = 'recording';
    actionBtn.textContent = mode === 'ptt' ? 'Release to Send' : 'Listening...';
  } else if (isProcessing) {
    actionBtn.className = 'processing';
    actionBtn.textContent = 'Thinking...';
  } else if (isPlaying) {
    actionBtn.className = 'playing';
    actionBtn.textContent = 'Speaking...';
  } else if (conversationActive) {
    actionBtn.className = 'listening';
    actionBtn.textContent = 'End Chat';
  } else {
    actionBtn.className = '';
    actionBtn.textContent = mode === 'ptt' ? 'Hold to Talk' : 'Start Chat';
  }
}

function addMessage(text, role, provider) {
  if (!text) return;
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.textContent = text;
  if (provider && role === 'assistant') {
    const tag = document.createElement('div');
    tag.className = 'provider-tag';
    tag.textContent = provider;
    div.appendChild(tag);
  }
  transcriptArea.appendChild(div);
  transcriptArea.scrollTop = transcriptArea.scrollHeight;
}

// ── Tab Visibility — pause VAD when hidden ────────
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (vadActive) stopVAD();
    if (isRecording) stopRecording();
  } else {
    if (conversationActive && ws && ws.readyState === WebSocket.OPEN) startVAD();
  }
});

// ── Keepalive ─────────────────────────────────────
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 30000);
</script>
