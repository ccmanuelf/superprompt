<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna — Eval Viewer</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --fg: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --pass: #3fb950;
    --fail: #f85149;
    --running: #d29922;
    --queued: #6e7681;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 24px;
  }
  h1, h2, h3 { color: var(--fg); margin-top: 0; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 16px 0 8px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .container { max-width: 1200px; margin: 0 auto; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 12px; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .row > .grow { flex: 1 1 auto; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.queued { background: var(--queued); color: #fff; }
  .badge.running { background: var(--running); color: #000; }
  .badge.completed { background: var(--pass); color: #000; }
  .badge.failed { background: var(--fail); color: #fff; }
  .pass { color: var(--pass); }
  .fail { color: var(--fail); }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  pre {
    background: #010409;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 4px;
    overflow-x: auto;
    font: 12px/1.4 'SF Mono', Menlo, Consolas, monospace;
    white-space: pre-wrap;
    margin: 4px 0;
    max-height: 280px;
    overflow-y: auto;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .config-label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    margin-right: 6px;
  }
  .config-with_skill { background: #1f6feb33; color: #58a6ff; }
  .config-without_skill { background: #6e768133; color: var(--muted); }
  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
  }
  .delta-positive { color: var(--pass); }
  .delta-negative { color: var(--fail); }
  .nav-back { font-size: 12px; }
  .pct { font-weight: 600; }
  .assertion-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .assertion-row:last-child { border-bottom: none; }
  .evidence { color: var(--muted); margin-top: 4px; padding-left: 12px; border-left: 2px solid var(--border); }
  details summary { cursor: pointer; padding: 6px 0; }
  details summary:hover { color: var(--accent); }
  .auth-prompt { padding: 32px 16px; text-align: center; }
  input.token-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: monospace;
    width: 320px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="container">
  <h1>🧪 Luna Eval Viewer</h1>
  <p class="muted small">
    Adapted from <code>skill-creator-v2</code> (Apache-2.0). Phase 1 (rc.98) — list view + per-session detail.
    Benchmark aggregation lands in rc.99, blind A/B in rc.100.
  </p>

  <div id="auth-section" class="panel" style="display:none">
    <div class="auth-prompt">
      <h2>Authentication required</h2>
      <p class="muted">Paste a per-user web token (generate one in Telegram with <code>/webtoken create</code>).</p>
      <p>
        <input id="token-input" class="token-input" type="password" placeholder="vw_..." autocomplete="off">
        <button onclick="saveToken()">Save</button>
      </p>
    </div>
  </div>

  <div id="content"></div>
</div>

<script>
const TOKEN_KEY = 'luna_voice_web_token';

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || '';
}

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  location.reload();
}

async function api(path) {
  const token = getToken();
  if (!token) {
    document.getElementById('auth-section').style.display = '';
    document.getElementById('content').innerHTML = '';
    return null;
  }
  const r = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('auth-section').style.display = '';
    document.getElementById('content').innerHTML = '<p class="muted">Token expired or invalid. Re-enter.</p>';
    return null;
  }
  return r.json();
}

function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  return (v * 100).toFixed(0) + '%';
}

function fmtDelta(withRate, withoutRate) {
  if (withRate === null || withoutRate === null) return '';
  const d = (withRate - withoutRate) * 100;
  if (Math.abs(d) < 0.5) return '<span class="muted small">±0%</span>';
  const cls = d > 0 ? 'delta-positive' : 'delta-negative';
  const sign = d > 0 ? '+' : '';
  return ' <span class="' + cls + ' small">(' + sign + d.toFixed(0) + '%)</span>';
}

function fmtDate(ms) {
  if (!ms) return '—';
  return new Date(Number(ms)).toLocaleString();
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function renderList() {
  const data = await api('/api/forge/evals');
  if (!data) return;
  const root = document.getElementById('content');
  if (!data.sessions || data.sessions.length === 0) {
    root.innerHTML = '<div class="panel empty">No eval sessions yet. Run <code>/skill eval &lt;name&gt;</code> in Telegram to create one.</div>';
    return;
  }
  let html = '<h2>Recent eval sessions</h2><div class="panel"><table>';
  html += '<thead><tr><th>#</th><th>Skill</th><th>Status</th><th>Pass rate</th><th>Created</th></tr></thead><tbody>';
  for (const s of data.sessions) {
    html += '<tr>';
    html += '<td><a href="?id=' + s.id + '">#' + s.id + '</a></td>';
    html += '<td><code>' + escapeHtml(s.skill_name) + '</code></td>';
    html += '<td><span class="badge ' + s.status + '">' + s.status + '</span></td>';
    html += '<td class="pct">' + fmtPct(s.pass_rate) + '</td>';
    html += '<td class="muted small">' + fmtDate(s.created_at) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  root.innerHTML = html;
}

async function renderDetail(id) {
  const data = await api('/api/forge/evals/' + id);
  if (!data) return;
  if (data.error) {
    document.getElementById('content').innerHTML = '<div class="panel empty">' + escapeHtml(data.error) + '</div>';
    return;
  }
  const s = data.session;
  let html = '<p class="nav-back"><a href="./">← all sessions</a></p>';
  html += '<div class="panel">';
  html += '<h2>Session #' + s.id + ' — <code>' + escapeHtml(s.skill_name) + '</code> <span class="badge ' + s.status + '">' + s.status + '</span></h2>';
  html += '<div class="row"><div class="grow muted small">';
  html += 'Created: ' + fmtDate(s.created_at) + ' • ';
  html += 'Calls planned: ' + s.total_calls_planned + ' • ';
  html += 'Runs/config: ' + s.runs_per_config;
  html += '</div></div>';

  // Pass-rate summary panel
  if (s.status === 'completed' && data.pass_rates) {
    const pr = data.pass_rates;
    html += '<h3 style="margin-top:16px">Pass rate</h3>';
    html += '<table>';
    html += '<tr><td><span class="config-label config-with_skill">with_skill</span></td><td class="pct">' + fmtPct(pr.with_skill) + '</td></tr>';
    html += '<tr><td><span class="config-label config-without_skill">without_skill</span></td><td class="pct">' + fmtPct(pr.without_skill) + '</td></tr>';
    html += '<tr><td>delta</td><td class="pct">' + fmtDelta(pr.with_skill, pr.without_skill).replace(/<span class="(.*?) small">/, '<span class="$1">').replace(/<\/span>/, '</span>') + '</td></tr>';
    html += '</table>';
  }

  // Prompts and expectations
  html += '<h3 style="margin-top:16px">Test prompts</h3><ol class="small">';
  for (const p of data.prompts) html += '<li>' + escapeHtml(p) + '</li>';
  html += '</ol>';

  html += '<h3>Expectations</h3><ol class="small">';
  for (const e of data.expectations) html += '<li>' + escapeHtml(e) + '</li>';
  html += '</ol>';
  html += '</div>';

  // Per-run breakdown — group by prompt_idx, show with_skill vs without_skill side-by-side
  const byPrompt = new Map();
  for (const r of data.runs) {
    if (!byPrompt.has(r.prompt_idx)) byPrompt.set(r.prompt_idx, []);
    byPrompt.get(r.prompt_idx).push(r);
  }
  for (const [pIdx, runs] of byPrompt) {
    html += '<div class="panel">';
    html += '<h3>Prompt ' + (pIdx + 1) + ': <span class="muted">' + escapeHtml(data.prompts[pIdx]) + '</span></h3>';

    const withSkill = runs.filter(r => r.configuration === 'with_skill');
    const withoutSkill = runs.filter(r => r.configuration === 'without_skill');

    html += '<div class="grid-2">';
    html += renderConfigColumn('with_skill', withSkill);
    html += renderConfigColumn('without_skill', withoutSkill);
    html += '</div>';
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

function renderConfigColumn(cfg, runs) {
  let html = '<div>';
  html += '<div><span class="config-label config-' + cfg + '">' + cfg + '</span> <span class="muted small">' + runs.length + ' run' + (runs.length === 1 ? '' : 's') + '</span></div>';
  if (runs.length === 0) {
    html += '<div class="muted small" style="padding:12px 0">no runs</div>';
    html += '</div>';
    return html;
  }
  for (const r of runs) {
    html += '<details ' + (runs.length === 1 ? 'open' : '') + '>';
    html += '<summary>Run #' + r.run_number + ' <span class="badge ' + r.status + '">' + r.status + '</span>';
    if (r.duration_ms) html += ' <span class="muted small">' + (r.duration_ms / 1000).toFixed(1) + 's</span>';
    if (r.assertions && r.assertions.length > 0) {
      const passed = r.assertions.filter(a => a.passed).length;
      html += ' <span class="small">' + passed + '/' + r.assertions.length + ' passed</span>';
    }
    html += '</summary>';

    if (r.error_message) {
      html += '<div class="fail small">Error: ' + escapeHtml(r.error_message) + '</div>';
    }
    if (r.output_text) {
      html += '<pre>' + escapeHtml(r.output_text) + '</pre>';
    }
    if (r.assertions && r.assertions.length > 0) {
      for (const a of r.assertions) {
        const cls = a.passed ? 'pass' : 'fail';
        const mark = a.passed ? '✓' : '✗';
        html += '<div class="assertion-row small">';
        html += '<span class="' + cls + '">' + mark + '</span> ' + escapeHtml(a.expectation_text);
        if (a.evidence) html += '<div class="evidence">' + escapeHtml(a.evidence) + '</div>';
        html += '</div>';
      }
    }
    html += '</details>';
  }
  html += '</div>';
  return html;
}

(async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (id) {
    await renderDetail(id);
  } else {
    await renderList();
  }
})();
</script>
</body>
</html>
