<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clauded — Learning Coach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }

    /* ── Auth ── */
    .auth { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
    .auth input { padding: 10px 16px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #e1e4e8; width: 280px; font-size: 14px; }
    .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 13px; transition: background 0.15s; }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #238636; border-color: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Header ── */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #161b22; border-bottom: 1px solid #30363d; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header .nav { display: flex; gap: 8px; align-items: center; }
    .header .nav a { color: #8b949e; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; transition: all 0.15s; }
    .header .nav a:hover { color: #e1e4e8; background: #21262d; }

    /* ── Stats Bar ── */
    .stats-bar { display: flex; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px 18px; flex: 1; min-width: 160px; display: flex; align-items: center; gap: 14px; }
    .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .stat-icon.time { background: rgba(88, 166, 255, 0.12); }
    .stat-icon.streak { background: rgba(210, 153, 34, 0.12); }
    .stat-icon.plans { background: rgba(63, 185, 80, 0.12); }
    .stat-icon.reviews { background: rgba(248, 81, 73, 0.12); }
    .stat-value { font-size: 22px; font-weight: 700; line-height: 1.1; }
    .stat-label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .stat-sub { font-size: 11px; color: #58a6ff; margin-top: 2px; }

    /* ── Main Layout ── */
    .main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .section-title { font-size: 14px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }

    /* ── Plan Cards Grid ── */
    .plans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 32px; }
    .plan-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
    .plan-card:hover { border-color: #58a6ff; transform: translateY(-1px); }
    .plan-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .plan-subject { font-size: 16px; font-weight: 600; }
    .plan-status { font-size: 10px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .plan-status.active { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
    .plan-status.paused { background: rgba(210, 153, 34, 0.15); color: #d29922; }
    .plan-status.completed { background: rgba(88, 166, 255, 0.15); color: #58a6ff; }
    .plan-card-body { display: flex; align-items: center; gap: 16px; }
    .mastery-ring { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .mastery-ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .mastery-ring .bg { fill: none; stroke: #21262d; stroke-width: 5; }
    .mastery-ring .fg { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
    .mastery-ring .pct { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; font-weight: 700; }
    .plan-details { flex: 1; }
    .plan-persona { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
    .plan-progress-text { font-size: 13px; margin-bottom: 6px; }
    .plan-progress-bar { height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; }
    .plan-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
    .plan-reviews { font-size: 11px; color: #f85149; margin-top: 6px; }

    /* ── Plan Detail View ── */
    .plan-detail { display: none; margin-bottom: 32px; }
    .plan-detail.active { display: block; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .detail-header h2 { font-size: 18px; font-weight: 600; }
    .detail-meta { font-size: 13px; color: #8b949e; margin-bottom: 16px; }
    .topic-list { background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
    .topic-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #21262d; gap: 12px; transition: background 0.1s; }
    .topic-row:last-child { border-bottom: none; }
    .topic-row:hover { background: #1c2128; }
    .topic-row.dragging { opacity: 0.4; }
    .topic-row.drag-over { border-top: 2px solid #58a6ff; }
    .topic-num { width: 24px; text-align: center; font-size: 12px; color: #484f58; font-weight: 600; }
    .topic-status { width: 20px; text-align: center; font-size: 14px; }
    .topic-title { flex: 1; font-size: 13px; font-weight: 500; }
    .topic-mastery { width: 120px; display: flex; align-items: center; gap: 6px; }
    .topic-mastery-bar { flex: 1; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
    .topic-mastery-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .topic-mastery-pct { font-size: 11px; color: #8b949e; width: 32px; text-align: right; }
    .topic-due { font-size: 10px; color: #f85149; padding: 2px 6px; background: rgba(248, 81, 73, 0.1); border-radius: 3px; }
    .topic-drag { cursor: grab; color: #484f58; font-size: 14px; padding: 0 4px; user-select: none; }
    .topic-drag:active { cursor: grabbing; }

    /* ── Study Time Chart ── */
    .chart-section { margin-bottom: 32px; }
    .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; position: relative; }
    .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .chart-bar { width: 100%; border-radius: 4px 4px 0 0; transition: height 0.4s ease; min-height: 2px; position: relative; }
    .chart-bar.today { box-shadow: 0 0 8px rgba(88, 166, 255, 0.3); }
    .chart-bar-label { font-size: 10px; color: #8b949e; }
    .chart-bar-value { font-size: 10px; color: #e1e4e8; font-weight: 600; }
    .chart-goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed #d29922; z-index: 1; }
    .chart-goal-label { position: absolute; right: 4px; font-size: 9px; color: #d29922; transform: translateY(-12px); }

    /* ── Sessions List ── */
    .sessions-section { margin-bottom: 32px; }
    .session-row { display: flex; align-items: center; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 6px; gap: 12px; font-size: 13px; }
    .session-date { width: 90px; color: #8b949e; font-size: 12px; }
    .session-topic { flex: 1; font-weight: 500; }
    .session-type { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: #21262d; color: #8b949e; }
    .session-duration { width: 50px; text-align: right; color: #8b949e; }
    .session-accuracy { width: 60px; text-align: right; font-weight: 600; }

    /* ── Empty State ── */
    .empty-state { text-align: center; padding: 48px 24px; color: #484f58; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; margin-bottom: 8px; }
    .empty-state .hint { font-size: 12px; color: #30363d; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .stats-bar { flex-direction: column; }
      .plans-grid { grid-template-columns: 1fr; }
      .topic-mastery { width: 80px; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="auth" class="auth">
    <h2>Learning Coach</h2>
    <input type="password" id="token-input" placeholder="Enter token" autofocus>
    <button class="btn btn-primary" onclick="authenticate()">Connect</button>
    <div id="auth-error" style="color: #f85149; font-size: 13px;"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="header">
      <h1>Learning Coach</h1>
      <div class="nav">
        <a href="board.html">Board</a>
        <button class="btn btn-sm" onclick="refresh()">Refresh</button>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="stats-bar">
      <div class="stat-card">
        <div class="stat-icon time">&#128337;</div>
        <div><div class="stat-value" id="stat-today">0m</div><div class="stat-label">Today</div><div class="stat-sub" id="stat-goal"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon streak">&#128293;</div>
        <div><div class="stat-value" id="stat-streak">0</div><div class="stat-label">Day Streak</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon plans">&#128218;</div>
        <div><div class="stat-value" id="stat-plans">0</div><div class="stat-label">Active Plans</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon reviews">&#128260;</div>
        <div><div class="stat-value" id="stat-reviews">0</div><div class="stat-label">Due Reviews</div></div>
      </div>
    </div>

    <div class="main">
      <!-- Plans Overview -->
      <div id="plans-overview">
        <div class="section-title">Learning Plans</div>
        <div class="plans-grid" id="plans-grid"></div>
      </div>

      <!-- Plan Detail (hidden by default) -->
      <div class="plan-detail" id="plan-detail">
        <div class="detail-header">
          <h2 id="detail-subject"></h2>
          <button class="btn btn-sm" onclick="showOverview()">Back to Plans</button>
        </div>
        <div class="detail-meta" id="detail-meta"></div>
        <div class="topic-list" id="topic-list"></div>
      </div>

      <!-- Study Time Chart -->
      <div class="chart-section">
        <div class="section-title">Study Time (7 Days)</div>
        <div class="chart-container">
          <div class="chart" id="time-chart"></div>
        </div>
      </div>

      <!-- Recent Sessions -->
      <div class="sessions-section">
        <div class="section-title">Recent Sessions</div>
        <div id="sessions-list"></div>
      </div>
    </div>
  </div>

<script>
let token = '', ws = null;
let allPlans = [], currentPlanId = null;
let timeData = null, sessionsData = [];

const PERSONA_LABELS = {
  guiding_challenger: 'Guiding Challenger',
  encouraging_coach: 'Encouraging Coach',
  friendly_conversational: 'Friendly Conversationalist',
  expert_scholar: 'Expert Scholar',
  creative_mentor: 'Creative Mentor',
};
const STATUS_ICONS = { pending: '\u2003', in_progress: '\u25B6', completed: '\u2714', deferred: '\u2014' };
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function authenticate() {
  token = document.getElementById('token-input').value;
  if (!token) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => {
    // First-message auth: send token + mode (never in URL)
    ws.send(JSON.stringify({ type: 'auth', token, mode: 'learn' }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'ready':
        document.getElementById('auth').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        refresh();
        break;
      case 'learn_plans': allPlans = msg.plans; renderPlans(); updateStatPlans(); break;
      case 'learn_plan_detail': renderPlanDetail(msg.plan, msg.topics); break;
      case 'learn_time_data': timeData = msg; renderTimeChart(); updateStatTime(); break;
      case 'learn_session_history': sessionsData = msg.sessions; renderSessions(); break;
      case 'error':
        if (document.getElementById('app').style.display === 'none') {
          document.getElementById('auth-error').textContent = msg.message;
        } else { console.error(msg.message); }
        break;
    }
  };
  ws.onerror = () => { document.getElementById('auth-error').textContent = 'Connection failed'; };
  ws.onclose = (e) => {
    if (e.code === 4001) {
      document.getElementById('auth-error').textContent = 'Invalid token';
      document.getElementById('auth').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  };
}

function send(msg) { if (ws?.readyState === 1) ws.send(JSON.stringify(msg)); }
function refresh() {
  send({ type: 'learn_list_plans' });
  send({ type: 'learn_time' });
  send({ type: 'learn_sessions', limit: 10 });
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Stats ──
function updateStatPlans() {
  const active = allPlans.filter(p => p.status === 'active');
  document.getElementById('stat-plans').textContent = active.length;
  const totalReviews = allPlans.reduce((s, p) => s + (p.dueReviews || 0), 0);
  document.getElementById('stat-reviews').textContent = totalReviews;
}

function updateStatTime() {
  if (!timeData) return;
  const mins = Math.round(timeData.today.seconds / 60);
  document.getElementById('stat-today').textContent = mins + 'm';
  document.getElementById('stat-goal').textContent = timeData.today.goalMet ? 'Goal met!' : (10 - mins) + 'm to goal';
  document.getElementById('stat-streak').textContent = timeData.streak;
}

// ── Mastery Ring SVG ──
function masteryRingSvg(pct, size = 64) {
  const r = (size - 10) / 2;
  const c = Math.PI * 2 * r;
  const offset = c - (pct / 100) * c;
  const color = pct >= 80 ? '#3fb950' : pct >= 50 ? '#d29922' : pct >= 20 ? '#58a6ff' : '#484f58';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg><span class="pct">${Math.round(pct)}%</span>`;
}

// ── Plans Grid ──
function renderPlans() {
  const grid = document.getElementById('plans-grid');
  if (allPlans.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">&#128218;</div><p>No learning plans yet</p><div class="hint">Start one in Telegram: /learn start &lt;goal&gt;</div></div>';
    return;
  }
  grid.innerHTML = '';
  for (const p of allPlans) {
    const pct = Math.round((p.avgMastery || 0) * 100);
    const progressPct = p.totalCount > 0 ? Math.round((p.completedCount / p.totalCount) * 100) : 0;
    const progressColor = pct >= 70 ? '#3fb950' : pct >= 40 ? '#d29922' : '#58a6ff';
    const card = document.createElement('div');
    card.className = 'plan-card';
    card.onclick = () => openPlan(p.id);
    card.innerHTML = `
      <div class="plan-card-top">
        <div class="plan-subject">${esc(p.subject)}</div>
        <span class="plan-status ${esc(p.status)}">${esc(p.status)}</span>
      </div>
      <div class="plan-card-body">
        <div class="mastery-ring">${masteryRingSvg(pct)}</div>
        <div class="plan-details">
          <div class="plan-persona">${esc(PERSONA_LABELS[p.persona] || p.persona)}</div>
          <div class="plan-progress-text">${p.completedCount}/${p.totalCount} topics completed</div>
          <div class="plan-progress-bar"><div class="plan-progress-fill" style="width:${progressPct}%;background:${progressColor}"></div></div>
          ${p.dueReviews > 0 ? `<div class="plan-reviews">${p.dueReviews} review(s) due</div>` : ''}
        </div>
      </div>`;
    grid.appendChild(card);
  }
}

// ── Plan Detail ──
function openPlan(planId) {
  currentPlanId = planId;
  document.getElementById('plans-overview').style.display = 'none';
  document.getElementById('plan-detail').classList.add('active');
  send({ type: 'learn_get_plan', planId });
}

function showOverview() {
  currentPlanId = null;
  document.getElementById('plans-overview').style.display = '';
  document.getElementById('plan-detail').classList.remove('active');
}

function renderPlanDetail(plan, topics) {
  document.getElementById('detail-subject').textContent = plan.subject;
  document.getElementById('detail-meta').innerHTML = `
    Goal: ${esc(plan.goal)} &middot; Persona: ${esc(PERSONA_LABELS[plan.persona] || plan.persona)} &middot; Status: ${esc(plan.status)}
  `;
  const list = document.getElementById('topic-list');
  list.innerHTML = '';
  for (const t of topics) {
    const pct = Math.round((t.effectiveMastery || t.mastery || 0) * 100);
    const color = pct >= 80 ? '#3fb950' : pct >= 50 ? '#d29922' : pct >= 20 ? '#58a6ff' : '#484f58';
    const icon = STATUS_ICONS[t.status] || ' ';
    const isDue = t.status === 'completed' && t.last_reviewed_at && (Date.now() - t.last_reviewed_at) > 24*60*60*1000 && pct < 80;
    const row = document.createElement('div');
    row.className = 'topic-row';
    row.draggable = true;
    row.dataset.id = t.id;
    row.dataset.order = t.sort_order;
    row.innerHTML = `
      <span class="topic-drag" title="Drag to reorder">&#8942;&#8942;</span>
      <span class="topic-num">${t.sort_order + 1}</span>
      <span class="topic-status">${icon}</span>
      <span class="topic-title">${esc(t.title)}</span>
      <div class="topic-mastery">
        <div class="topic-mastery-bar"><div class="topic-mastery-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="topic-mastery-pct">${pct}%</span>
      </div>
      ${isDue ? '<span class="topic-due">Review</span>' : ''}
    `;
    // Drag events
    row.ondragstart = (e) => { e.dataTransfer.setData('text/plain', t.id); row.classList.add('dragging'); };
    row.ondragend = () => { row.classList.remove('dragging'); };
    row.ondragover = (e) => { e.preventDefault(); row.classList.add('drag-over'); };
    row.ondragleave = () => { row.classList.remove('drag-over'); };
    row.ondrop = (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const draggedId = e.dataTransfer.getData('text/plain');
      if (draggedId && draggedId !== t.id) {
        send({ type: 'learn_reorder', topicId: draggedId, newPosition: t.sort_order });
      }
    };
    list.appendChild(row);
  }
}

// ── Time Chart ──
function renderTimeChart() {
  if (!timeData) return;
  const chart = document.getElementById('time-chart');
  chart.innerHTML = '';
  const today = new Date().toISOString().slice(0, 10);

  // Build 7-day array
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 24 * 60 * 60 * 1000);
    const dateStr = d.toISOString().slice(0, 10);
    const entry = timeData.week.find(w => w.date === dateStr);
    days.push({
      date: dateStr,
      day: DAYS[d.getDay()],
      minutes: entry ? Math.round(entry.total_seconds / 60) : 0,
      isToday: dateStr === today,
    });
  }

  const maxMin = Math.max(15, ...days.map(d => d.minutes));

  // Goal line
  const goalPct = (10 / maxMin) * 100;
  const goalLine = document.createElement('div');
  goalLine.className = 'chart-goal-line';
  goalLine.style.bottom = goalPct + '%';
  goalLine.innerHTML = '<span class="chart-goal-label">10m goal</span>';
  chart.appendChild(goalLine);

  for (const d of days) {
    const heightPct = maxMin > 0 ? (d.minutes / maxMin) * 100 : 0;
    const color = d.minutes >= 10 ? '#3fb950' : d.minutes > 0 ? '#d29922' : '#21262d';
    const wrap = document.createElement('div');
    wrap.className = 'chart-bar-wrap';
    wrap.innerHTML = `
      <div class="chart-bar-value">${d.minutes > 0 ? d.minutes + 'm' : ''}</div>
      <div class="chart-bar ${d.isToday ? 'today' : ''}" style="height:${Math.max(2, heightPct)}%;background:${color}"></div>
      <div class="chart-bar-label">${d.day}</div>
    `;
    chart.appendChild(wrap);
  }
}

// ── Sessions ──
function renderSessions() {
  const list = document.getElementById('sessions-list');
  if (sessionsData.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>No sessions yet</p></div>';
    return;
  }
  list.innerHTML = '';
  for (const s of sessionsData) {
    const date = new Date(s.started_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const mins = s.duration_seconds ? Math.round(s.duration_seconds / 60) : 0;
    const accuracy = s.questions_asked > 0 ? Math.round((s.correct_answers / s.questions_asked) * 100) : null;
    const accColor = accuracy !== null ? (accuracy >= 80 ? '#3fb950' : accuracy >= 50 ? '#d29922' : '#f85149') : '#484f58';
    const row = document.createElement('div');
    row.className = 'session-row';
    row.innerHTML = `
      <span class="session-date">${date}</span>
      <span class="session-topic">${esc(s.topic_id || 'General')}</span>
      <span class="session-type">${esc(s.session_type)}</span>
      <span class="session-duration">${mins}m</span>
      <span class="session-accuracy" style="color:${accColor}">${accuracy !== null ? accuracy + '%' : '-'}</span>
    `;
    list.appendChild(row);
  }
}

// ── Init ──
document.getElementById('token-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') authenticate(); });

// Token is entered manually via the auth screen — never passed in URL
</script>
</body>
</html>
