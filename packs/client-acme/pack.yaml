name: client-acme
display_name: "ACME Corp Integration"
description: >
  Sample client integration pack demonstrating the SaaS revenue model.
  Connects to ACME Corp's Shopify store for order ingestion and
  shipment status updates. Shows how declarative HTTP tools enable
  client API integrations without custom code.
version: "0.1.0"
author: novalink
enabled: true
level: 2

departments:
  - manufacturing
  - customer-service

capabilities: |
  ### ACME Corp Integration
  Client integration tools for ACME Corp:
  - Pull new orders from ACME's Shopify store
  - Check order status and fulfillment progress
  - Post shipment tracking information back to Shopify
  - Generate order summary reports
  Note: API credentials required in .env (CLIENT_ACME_SHOPIFY_TOKEN)

self_description: |
  **ACME Corp Integration** — Connected to ACME's Shopify store.
  I can pull their orders, check fulfillment status, and post shipment updates.

intent_patterns:
  - pattern: \b(acme|ACME)\b.*\b(order|shipment|fulfillment)\b
    score_boost: 20
    tools: [acme_get_orders, acme_order_status, acme_post_shipment]
    web_apps: []
  - pattern: \b(client|customer)\b.*\b(order|integration)\b
    score_boost: 10
    tools: [acme_get_orders]
    web_apps: []
  - pattern: \b(shopify|store)\b.*\b(order|pull|sync)\b
    score_boost: 15
    tools: [acme_get_orders]
    web_apps: []

commands:
  - name: acme
    description: ACME Corp integration — orders, shipments, status
