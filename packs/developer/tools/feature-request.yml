name: feature_request
type: function
description: >
  Manages the Level 3 feature request lifecycle. Creates kanban cards,
  schedules off-hours review, monitors status changes, and notifies
  stakeholders at each step of the 13-step workflow.

parameters:
  type: object
  properties:
    action:
      type: string
      enum: [create, status, list, review_complete, approve, reject, deploy_verify]
      description: >
        The workflow action to perform:
        - create: Create a feature request card with PRD (steps 3-4)
        - status: Check the status of a feature request (step 9)
        - list: List all pending feature requests
        - review_complete: Mark dev team review as complete (step 8)
        - approve: Mark feature as approved for deployment (step 10)
        - reject: Mark feature as rejected with reason (step 11)
        - deploy_verify: Verify deployment and close card (steps 12-13)
    title:
      type: string
      description: Feature request title (for create action)
    description:
      type: string
      description: Full PRD content or rejection reason
    priority:
      type: integer
      description: Priority 1-5 (1=critical)
    card_id:
      type: string
      description: Kanban card ID (for status/approve/reject/deploy_verify)
    target_url:
      type: string
      description: URL to verify after deployment (for deploy_verify)
  required: [action]

# This tool runs in the Worker sandbox (Level 2)
# It interacts with kanban and notification systems via the platform context
execution:
  type: generated_code
  code: |
    // Feature request workflow automation
    // This code runs in the V8 sandbox — no direct DB access
    // It returns structured data for the platform to process

    const { action, title, description, priority, card_id, target_url } = args;

    switch (action) {
      case 'create':
        if (!title) return { error: 'Title is required for create action' };
        return {
          __workflow: 'feature_request_create',
          title: `[L3] ${title}`,
          description: description || 'PRD pending',
          priority: priority || 2,
          assignee: 'noted',
          labels: ['level-3', 'feature-request', 'pending-review'],
          notification: {
            message: `📋 Feature request created: **${title}**\nYour request will be reviewed during off-hours and submitted to the dev team.\nYou can modify the PRD until then by updating the card.\n\n📋 Solicitud creada: **${title}**\nSu solicitud será revisada fuera de horario y enviada al equipo de desarrollo.`,
          },
        };

      case 'status':
        if (!card_id) return { error: 'card_id is required for status action' };
        return {
          __workflow: 'feature_request_status',
          card_id,
        };

      case 'list':
        return {
          __workflow: 'feature_request_list',
          filter: { labels: ['feature-request'] },
        };

      case 'review_complete':
        if (!card_id) return { error: 'card_id is required' };
        return {
          __workflow: 'feature_request_review',
          card_id,
          new_status: 'review',
          notification: {
            to: 'user',
            message: `👀 Your feature request is under dev team review. Expect a response within 48 hours.\n\n👀 Su solicitud está siendo revisada. Espere respuesta en 48 horas.`,
          },
        };

      case 'approve':
        if (!card_id) return { error: 'card_id is required' };
        return {
          __workflow: 'feature_request_approve',
          card_id,
          new_status: 'in_progress',
          notification: {
            to: 'user',
            message: `✅ Feature request approved! Deployment scheduled for the next off-hours window.\n\n✅ Solicitud aprobada. Despliegue programado para la próxima ventana fuera de horario.`,
          },
        };

      case 'reject':
        if (!card_id) return { error: 'card_id is required' };
        return {
          __workflow: 'feature_request_reject',
          card_id,
          new_status: 'cancelled',
          reason: description || 'No reason provided',
          notification: {
            to: 'user',
            message: `❌ Feature request was not approved.\nReason: ${description || 'No reason provided'}\n\n❌ Solicitud no aprobada.\nRazón: ${description || 'Sin razón proporcionada'}`,
          },
        };

      case 'deploy_verify':
        if (!card_id) return { error: 'card_id is required' };
        return {
          __workflow: 'feature_request_deploy',
          card_id,
          target_url,
          new_status: 'done',
          notification: {
            to: 'user',
            message: `🚀 Feature deployed and verified!\n${target_url ? `Access it at: ${target_url}` : 'Check with the dev team for access details.'}\n\n🚀 Función desplegada y verificada.\n${target_url ? `Acceda en: ${target_url}` : 'Consulte con el equipo de desarrollo.'}`,
          },
        };

      default:
        return { error: `Unknown action: ${action}. Use: create, status, list, review_complete, approve, reject, deploy_verify` };
    }
